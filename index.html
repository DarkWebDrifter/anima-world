<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANIMA World</title>
<style>html,body{height:100%;margin:0;background:#0F1828;color:#9AA6BD;font-family:Georgia,serif}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}h1{font-weight:400;color:#E9EDF5;margin:0;font-size:28px}p{margin:0;font-family:system-ui,sans-serif;font-size:15px}.dot{width:8px;height:8px;border-radius:50%;background:#F2B45A;animation:b 1.2s infinite}@keyframes b{50%{opacity:.2}}</style>
</head>
<body>
<main><div class="dot"></div><h1>ANIMA World</h1><p id="l">Il mondo si sta svegliando…</p></main>
<script>
fetch("https://nclmgyvlbsimnbhmzywr.supabase.co/functions/v1/app",{cache:"no-store"})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
.then(function(h){document.open();document.write(h);document.close();})
.catch(function(){document.getElementById("l").textContent="Il mondo non risponde in questo momento. Riprova tra poco.";});
</script>
</body>
</html>
